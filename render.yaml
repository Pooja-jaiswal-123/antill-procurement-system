services:
  # Backend - FastAPI
  - type: web
    name: corvo-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_POLICY_PATH
        value: /etc/secrets/policy_v5_0.json
      - key: APP_ENV
        value: development

  # Frontend - Next.js
  - type: web
    name: corvo-ui
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: API_URL
        sync: false