services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-allam-2-7b}
      - GROQ_API_URL=${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - DATABASE_URL=${DATABASE_URL:-}
      - APP_ENV=${APP_ENV:-development}
    volumes:
      - ./backend/data:/app/data      # kit CSVs / RC-*.pdf go here (not committed); SQLite file lives here too
  frontend:
    build:
      context: ./frontend
      args: { API_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]
